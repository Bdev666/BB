<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6cff"/>
      <stop offset="0.55" stop-color="#5b3fd9"/>
      <stop offset="1" stop-color="#26175e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6defc"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f7a928"/>
      <stop offset="1" stop-color="#ffe27a"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12082e" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#gloss)"/>
  <!-- fanned binder cards -->
  <g filter="url(#sh)">
    <rect x="128" y="118" width="196" height="268" rx="26" fill="#b9a7ff" opacity="0.55" transform="rotate(-14 226 252)"/>
    <rect x="150" y="112" width="196" height="268" rx="26" fill="#d6cbff" opacity="0.8" transform="rotate(-5 248 246)"/>
    <rect x="176" y="112" width="196" height="268" rx="26" fill="url(#card)" transform="rotate(6 274 246)"/>
  </g>
  <!-- rising line on the front card -->
  <g transform="rotate(6 274 246)">
    <polyline points="206,316 248,272 278,292 334,214" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M334 214 l-40 2 l30 30 z" fill="#ffd34d" transform="rotate(-8 334 214)"/>
    <circle cx="206" cy="316" r="13" fill="#5b3fd9"/>
    <rect x="200" y="148" width="92" height="16" rx="8" fill="#5b3fd9" opacity="0.85"/>
    <rect x="200" y="176" width="58" height="12" rx="6" fill="#5b3fd9" opacity="0.35"/>
  </g>
</svg>
