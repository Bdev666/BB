name: BinderDash Windows build

on:
  push:
    paths:
      - 'bindertown-dash/**'
      - '.github/workflows/binderdash-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bindertown-dash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bindertown-dash/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: BinderDash-Setup
          path: bindertown-dash/dist/*.exe
          if-no-files-found: error
