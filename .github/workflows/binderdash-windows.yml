name: BinderDash build (Windows + macOS)

# Every push to bindertown-dash/ builds the installer and publishes it as the
# GitHub Release "v<version>" (version from package.json) when that release
# doesn't exist yet. Installed copies of BinderDash pick new releases up through
# their in-app updater, so bumping "version" ships an update to everyone.
on:
  push:
    # with tags listed, branches must be listed too or branch pushes stop triggering
    branches:
      - '**'
    paths:
      - 'bindertown-dash/**'
      - '.github/workflows/binderdash-windows.yml'
    tags:
      - 'binderdash-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bindertown-dash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bindertown-dash/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Is this version released yet?
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v is already released: build only"; echo "publish=never" >> "$GITHUB_OUTPUT"
          else
            echo "releasing v$v"; echo "publish=always" >> "$GITHUB_OUTPUT"
          fi
      - name: Release notes from the commit message
        shell: bash
        run: |
          git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed -e '/^$/N;/^\n$/D' > build/release-notes.md
          cat build/release-notes.md
      - name: Build (and publish the release when new)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish ${{ steps.rel.outputs.publish }}
      - uses: actions/upload-artifact@v4
        with:
          name: BinderDash-Setup
          path: |
            bindertown-dash/dist/*.exe
            bindertown-dash/dist/latest.yml
          if-no-files-found: error

  # macOS (.dmg, Intel + Apple Silicon in one app), after the Windows job has made the release.
  # Not signed with an Apple Developer ID (ad-hoc only): first open = right click > Open.
  mac:
    needs: build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: bindertown-dash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bindertown-dash/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --universal --publish never
      - name: Add the Mac files to the release (when that release has none yet)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          if ! gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "no release v$v: build only"; exit 0; fi
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -q '^latest-mac.yml$'; then echo "mac files already there"; exit 0; fi
          ls dist
          gh release upload "v$v" dist/*.dmg dist/*-mac.zip dist/latest-mac.yml --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: BinderDash-mac
          path: |
            bindertown-dash/dist/*.dmg
            bindertown-dash/dist/latest-mac.yml
          if-no-files-found: error
